apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: python-cicd
  labels:
    app.kubernetes.io/name: python-cicd
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: python-cicd
  minReplicas: 2
  maxReplicas: 5
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
