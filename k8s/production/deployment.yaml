apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-cicd-api
  labels:
    app.kubernetes.io/name: python-cicd
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: python-cicd
      app.kubernetes.io/instance: production
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: python-cicd
        app.kubernetes.io/instance: production
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-public-file
          image: rezwanul7/python-cicd:sha-7a3609758c010806a988b15bace5b0522fbe5abf
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - >-
              test -f /writable-public/demo.txt || cp
              /home/appuser/public/demo.txt /writable-public/demo.txt
          volumeMounts:
            - name: public-data
              mountPath: /writable-public
      containers:
        - name: api
          image: rezwanul7/python-cicd:sha-7a3609758c010806a988b15bace5b0522fbe5abf
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: python-cicd-api-config
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
            - name: public-data
              mountPath: /home/appuser/public
      volumes:
        - name: temporary-files
          emptyDir: {}
        - name: public-data
          persistentVolumeClaim:
            claimName: python-cicd-public-data
      terminationGracePeriodSeconds: 30
