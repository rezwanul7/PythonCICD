apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fastship-app-uploads
  labels:
    app.kubernetes.io/name: fastship-app
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: api
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: fastship-app-uploads-nfs
  resources:
    requests:
      storage: 1Gi
