services:
  python-ci-cd-app:
    image: rezwanul7/python-cicd:${APP_TAG:-latest}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
