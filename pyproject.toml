[tool.poetry]
name = "fastship-app"
version = "0.2.0"
description = ""
authors = ["Rezwanul Islam <rezwanul7@gmail.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.141.1"
uvicorn = {version = "^0.52.1", extras = ["standard"]}

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
httpx2 = "^2.9.1"
ruff = "^0.16.2"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["poetry-core>=1.5.1"]
build-backend = "poetry.core.masonry.api"
