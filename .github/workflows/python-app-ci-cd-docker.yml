# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python App Docker Build

on:
  push:
    branches:
      - github-actions-cd-docker

    # ignore pull request events to paths matching **.md and .github/workflows/*yml
    paths-ignore:
      - '**.md'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
      - name: Install Project Dependencies
        run: poetry install --no-interaction --no-root
      - name: Run Tests
        run: poetry run python -m pytest -v
      - name: Run Ruff Lint
        run: poetry run ruff check .
      - name: Check Ruff Formatting
        run: poetry run ruff format --check .
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Check Dockerfile
        run: docker build --check .
      - name: Build and validate production image
        run: |
          docker build --tag python-cicd:ci-production .
          docker run --rm python-cicd:ci-production sh -c \
            'test "$(id -un)" = appuser && test "$(id -u)" = 10001'
          docker run --rm python-cicd:ci-production python -c \
            "import importlib.util; import fastapi, uvicorn; assert importlib.util.find_spec('poetry') is None; assert importlib.util.find_spec('pytest') is None"
      - name: Smoke-test production image
        run: |
          container_id="$(docker run --detach --publish 127.0.0.1:8000:8000 python-cicd:ci-production)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:8000/health
      - name: Build and test development image
        run: |
          docker build \
            --build-arg BUILD_ENVIRONMENT=development \
            --tag python-cicd:ci-development .
          docker run --rm python-cicd:ci-development python -m pytest -v


  build_deploy_docker_container:
    name: Build Docker Container, Push to Docker hub & Deploy to the Staging Server
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        run: echo ${{ secrets.DOCKERHUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build and push Docker image
        env:
          DOCKER_REPO: rezwanul7/python-cicd
        run: |
          docker buildx create --use
          docker buildx build \
            --file Dockerfile \
            --tag $DOCKER_REPO:latest \
            --push .

      - name: Copy files via scp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          source: "compose.yaml,compose.stag.yaml"
          target: ~/PythonCICD/

      - name: Deploy and verify staging
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd ~/PythonCICD
            docker compose -f compose.yaml -f compose.stag.yaml pull
            docker compose -f compose.yaml -f compose.stag.yaml up -d --remove-orphans
            curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused http://localhost:5051/health
