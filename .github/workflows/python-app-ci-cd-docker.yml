name: Python App Docker Build

on:
  push:
    branches:
      - dev
      - staging
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - dev
      - staging
      - main
    paths-ignore:
      - '**.md'

concurrency:
  group: python-cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_REPO: rezwanul7/python-cicd
  PRODUCTION_IMAGE: python-cicd:ci-production

jobs:
  build:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
      - name: Install Project Dependencies
        run: poetry install --no-interaction --no-root
      - name: Run Tests
        run: poetry run python -m pytest -v
      - name: Run Ruff Lint
        run: poetry run ruff check .
      - name: Check Ruff Formatting
        run: poetry run ruff format --check .
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Check Dockerfile
        run: docker build --check .
      - name: Validate Docker Compose configurations
        run: |
          docker compose -f docker/docker-compose.yaml -f docker/docker-compose.dev.yaml config --quiet
          docker compose -f docker/docker-compose.yaml -f docker/docker-compose.staging.yaml config --quiet
          docker compose -f docker/docker-compose.yaml -f docker/docker-compose.prod.yaml config --quiet
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Render Kubernetes manifests
        run: |
          mkdir -p .tmp/k8s
          for manifest in k8s/production/*.yaml; do
            echo '---' >> .tmp/k8s/production.yaml
            cat "$manifest" >> .tmp/k8s/production.yaml
          done
      - name: Validate Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          entrypoint: /kubeconform
          args: >-
            -strict -summary
            /github/workspace/.tmp/k8s/production.yaml
      - name: Build and validate production image
        run: |
          docker build --tag "$PRODUCTION_IMAGE" .
          docker run --rm "$PRODUCTION_IMAGE" sh -c \
            'test "$(id -un)" = appuser && test "$(id -u)" = 10001'
          docker run --rm "$PRODUCTION_IMAGE" python -c \
            "import importlib.util; import fastapi, uvicorn; assert importlib.util.find_spec('poetry') is None; assert importlib.util.find_spec('pytest') is None"
      - name: Smoke-test staging and production configuration
        run: |
          for environment in staging production; do
            container_id="$(docker run --detach \
              --env APP_ENV="$environment" \
              --publish 127.0.0.1:8000:8000 \
              "$PRODUCTION_IMAGE")"
            trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT

            for probe in startup live ready; do
              curl --fail --silent --show-error --retry 10 --retry-delay 2 \
                --retry-connrefused --retry-all-errors \
                "http://127.0.0.1:8000/health/$probe"
            done

            curl --fail --silent --show-error http://127.0.0.1:8000/ \
              | python -c 'import json, sys; assert json.load(sys.stdin)["environment"] == sys.argv[1]' "$environment"

            docker rm --force "$container_id"
            trap - EXIT
          done
      - name: Build and test development image
        run: |
          docker build \
            --build-arg BUILD_ENVIRONMENT=development \
            --tag python-cicd:ci-development .
          docker run --rm python-cicd:ci-development python -m pytest -v
      - name: Select Docker Hub tags
        if: github.event_name == 'push'
        id: image
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            dev) channel_tag=dev ;;
            staging) channel_tag=staging ;;
            main) channel_tag=latest ;;
            *) echo "Unsupported publishing branch: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac

          echo "immutable=$DOCKER_REPO:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "channel=$DOCKER_REPO:$channel_tag" >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      - name: Publish tested image
        if: github.event_name == 'push'
        env:
          IMMUTABLE_IMAGE: ${{ steps.image.outputs.immutable }}
          CHANNEL_IMAGE: ${{ steps.image.outputs.channel }}
        run: |
          docker tag "$PRODUCTION_IMAGE" "$IMMUTABLE_IMAGE"
          docker tag "$PRODUCTION_IMAGE" "$CHANNEL_IMAGE"
          docker push "$IMMUTABLE_IMAGE"
          docker push "$CHANNEL_IMAGE"

          docker pull "$IMMUTABLE_IMAGE"
          repository_digest="$(docker image inspect \
            --format '{{index .RepoDigests 0}}' \
            "$IMMUTABLE_IMAGE")"
          image_digest="${repository_digest#*@}"

          jq --null-input \
            --arg repository "$DOCKER_REPO" \
            --arg digest "$image_digest" \
            --arg immutable_image "$IMMUTABLE_IMAGE" \
            --arg channel_image "$CHANNEL_IMAGE" \
            --arg source_sha "$GITHUB_SHA" \
            --arg branch "$GITHUB_REF_NAME" \
            '{repository: $repository, digest: $digest, immutable_image: $immutable_image, channel_image: $channel_image, source_sha: $source_sha, branch: $branch}' \
            > release-metadata.json

          {
            echo '## Published image'
            echo
            echo "- Immutable image: \`$IMMUTABLE_IMAGE\`"
            echo "- Channel image: \`$CHANNEL_IMAGE\`"
            echo "- Repository digest: \`$repository_digest\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release metadata
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata-${{ github.sha }}
          path: release-metadata.json
          if-no-files-found: error
          retention-days: 90
